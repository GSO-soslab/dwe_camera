# Parameters for a single camera_node instance for AprilTag detection.
# The top-level key matches the full node name: /{namespace}/{node_name}
/dwe_camera/camera_node:
  ros__parameters:
    # Apriltag Parameters:
    apriltag:
      enable: True        # Set to True to enable AprilTag detection
      # family: 'tag25h9'   # The family of tags to detect (e.g., 'tag36h11', 'tag25h9', 'tag16h5')
      # size: 0.21          # The size of the tag's black square in meters
      family: 'tag36h11'   # The family of tags to detect (e.g., 'tag36h11', 'tag25h9', 'tag16h5')
      size: 0.125          # The size of the tag's black square in meters
      publish_rate: 2     # Rate (Hz) to publish the detection image topic

      # --- Tunable parameters for the pupil-apriltags detector ---
      # These parameters are now read-only after startup. To change them,
      # you must edit this file and restart the node.
      # See pupil-apriltags documentation for details: https://pupil-apriltags.readthedocs.io/
      detector:
        # Number of threads to use for detection. Default is 1. More can improve speed on multi-core CPUs.
        nthreads: 1
        # Quad decimation factor. Reduces image size for faster quad detection.
        # A value of 2.0 is a good balance of speed and robustness. Default is 2.0.
        quad_decimate: 2.0
        # Gaussian blur sigma for quad detection. Small amounts can help with noisy images. Default is 0.0.
        quad_sigma: 0.0
        # Refine quad edges to subpixel accuracy. Improves pose estimation. Default is True.
        refine_edges: True
        # Amount of sharpening to apply to the decoded tag bits. Default is 0.25.
        decode_sharpening: 0.25

    # Video stream settings
    video:
      id: 2
      width: 1600
      height: 1200
      framerate: 15
      format: 'MJPG'
      
    # Aux processs
    aux_process:
      img_raw: False
      img_raw_mono: False
      img_raw_framerate: 1
      img_calibrated: False

    # Settings for the low-bandwidth compressed stream (0 target_fps will disable this topic)
    compression:
      width: 320
      height: 240
      target_fps: 0 
      jpeg_quality: 90

    # Camera hardware control settings for a raw, unprocessed image
    camera:
      # --- Exposure Controls (Manual) ---
      auto_exposure: True                # MUST be False for manual control.
      exposure_time: 156                  # TUNE THIS VALUE: Manually set for correct brightness.
      gain: 0                             # Minimum digital gain to reduce noise.
      # --- White Balance Controls (Manual) ---
      white_balance_automatic: True      # MUST be False for manual control.
      white_balance_temperature: 4600     # TUNE THIS VALUE: Manually set for correct color.
      # --- Enhancement & Compensation Filters (Disabled/Minimal) ---
      sharpness: 0                        # Minimum sharpness (disables edge enhancement).
      backlight_compensation: 0           # Minimum (disabled).
      power_line_frequency: 0             # Disabled. May cause flicker under AC lights.
      # --- Color & Tone Controls (Neutral/Default) ---
      brightness: 0                       # Neutral brightness.
      contrast: 32                        # Lower contrast for a "flatter" image.
      saturation: 64                      # Neutral color saturation.
      hue: 0                              # Neutral hue.
      gamma: 100                          # Default gamma curve.
      # --- Camera Intrinsics (REQUIRED for pose estimation) ---
      # These values must be calibrated for your specific camera.
      # dwe stellarhd air
      intrinsics:
        fx: 953.919689
        fy: 954.022011
        cx: 818.210277
        cy: 665.849871
      # Distortion coefficients. Standard model: [k1, k2, p1, p2, k3...]. Fisheye model: [k1, k2, k3, k4].
      # Ensure the coefficients match the model selected by the 'fisheye' flag below.
      distortion: [-0.064599, -0.002388, 0.001767, 0.000415]
      # Set to true to use the fisheye model for undistortion, false for standard (plumb bob) model.
      fisheye: True
      # Set to true to crop the undistorted image to show only valid pixels (removes black borders).
      # This applies to both standard and fisheye models.
      undistort_crop: True

    # ROS-specific settings
    ros:
      frame_id: "dwe_camera_frame"